version: "2"
run:
  go: "1.25"
linters:
  enable:
    - bodyclose
    - cyclop
    - errcheck
    - funlen
    - gocognit
    - gomoddirectives
    - govet
    - gosec
    - ineffassign
    - misspell
    - nestif
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: unexported-return
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
