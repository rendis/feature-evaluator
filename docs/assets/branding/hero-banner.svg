<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="40" x2="840" y2="40"/>
    <line x1="0" y1="80" x2="840" y2="80"/>
    <line x1="0" y1="120" x2="840" y2="120"/>
    <line x1="0" y1="160" x2="840" y2="160"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="360" y1="0" x2="360" y2="200"/>
    <line x1="480" y1="0" x2="480" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
  </g>

  <!-- Decorative dots (right side) -->
  <g opacity="0.12">
    <circle cx="700" cy="40" r="2" fill="#38bdf8"/>
    <circle cx="720" cy="55" r="1.5" fill="#818cf8"/>
    <circle cx="740" cy="35" r="2.5" fill="#c084fc"/>
    <circle cx="760" cy="50" r="1.5" fill="#38bdf8"/>
    <circle cx="710" cy="70" r="2" fill="#818cf8"/>
    <circle cx="750" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="780" cy="40" r="2" fill="#38bdf8"/>
    <circle cx="690" cy="55" r="1.5" fill="#818cf8"/>
  </g>

  <!-- Flag icon -->
  <g transform="translate(60, 52)">
    <!-- Flagpole -->
    <rect x="0" y="0" width="3" height="96" rx="1.5" fill="#64748b"/>
    <!-- Flag -->
    <path d="M3 4 L3 52 Q25 40 47 52 L47 4 Q25 16 3 4Z" fill="url(#accent)" opacity="0.9"/>
    <!-- Toggle circle on flag -->
    <circle cx="25" cy="28" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="28" cy="28" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Project name -->
  <text x="130" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">
    Feature Evaluator
  </text>

  <!-- Tagline -->
  <text x="132" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" letter-spacing="0.2">
    Rule-based feature flags with segments, packs, experiments, and a full admin console
  </text>

  <!-- Tech pills -->
  <g transform="translate(132, 140)">
    <!-- Go -->
    <rect x="0" y="0" width="52" height="24" rx="12" fill="#38bdf8" opacity="0.15"/>
    <text x="26" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="600">Go</text>

    <!-- React -->
    <rect x="62" y="0" width="64" height="24" rx="12" fill="#818cf8" opacity="0.15"/>
    <text x="94" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="600">React</text>

    <!-- PostgreSQL -->
    <rect x="136" y="0" width="86" height="24" rx="12" fill="#c084fc" opacity="0.15"/>
    <text x="179" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="600">PostgreSQL</text>

    <!-- OFREP -->
    <rect x="232" y="0" width="66" height="24" rx="12" fill="#38bdf8" opacity="0.15"/>
    <text x="265" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="600">OFREP</text>

    <!-- expr-lang -->
    <rect x="308" y="0" width="76" height="24" rx="12" fill="#818cf8" opacity="0.15"/>
    <text x="346" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="600">expr-lang</text>
  </g>

  <!-- Decorative code snippet (right side) -->
  <g transform="translate(620, 65)" opacity="0.25">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#38bdf8">if</text>
    <text x="24" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#94a3b8"> user.plan == </text>
    <text x="115" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#a5f3fc">"pro"</text>
    <text x="12" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#38bdf8">  &amp;&amp;</text>
    <text x="36" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#94a3b8"> inSegment(</text>
    <text x="105" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#a5f3fc">"beta"</text>
    <text x="135" y="40" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#94a3b8">)</text>
    <text x="12" y="58" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#38bdf8">  &amp;&amp;</text>
    <text x="36" y="58" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#94a3b8"> authenticated</text>
    <rect x="12" y="68" width="60" height="2" rx="1" fill="url(#accent2)"/>
  </g>
</svg>
