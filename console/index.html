<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feature Evaluator</title>
    <script>
      (function () {
        var storageKey = 'fe-theme';
        var mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        var theme = 'system';

        try {
          var stored = window.localStorage.getItem(storageKey);
          if (stored) {
            var parsed = JSON.parse(stored);
            var candidate = parsed && parsed.state && parsed.state.theme;
            if (candidate === 'light' || candidate === 'dark' || candidate === 'system') {
              theme = candidate;
            }
          }
        } catch {}

        var resolvedTheme = theme === 'system' ? (mediaQuery.matches ? 'dark' : 'light') : theme;
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(resolvedTheme);
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
