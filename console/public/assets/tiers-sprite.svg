<svg xmlns="http://www.w3.org/2000/svg">

    <style>
    /* Default styles ensuring icons are visible out-of-the-box.
      You can override these colors in your app's CSS by setting the variables:
      .your-icon { --icon-fill: #fff; --icon-stroke: #000; }
    */
    symbol {
      fill: var(--icon-fill, #e0e5ec);
      stroke: var(--icon-stroke, #9baac2);
      stroke-width: var(--icon-stroke-width, 2.2);
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    </style>

    <!-- 3D NEUMORPHIC FILTER -->
    <defs>
        <filter id="icon-3d-effect" x="-30%" y="-30%" width="160%" height="160%">
            <!-- Dark shadow (Bottom-Right) -->
            <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.5" flood-color="#a3b1c6" flood-opacity="0.9" result="shadow-dark" />
            <!-- Light glow (Top-Left) -->
            <feDropShadow dx="-2.5" dy="-2.5" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="1" result="shadow-light" />

            <!-- Merge -->
            <feMerge>
                <feMergeNode in="shadow-dark" />
                <feMergeNode in="shadow-light" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- ========================================== -->
    <!-- 1. ENTRY / ACCESS                          -->
    <!-- Icons for free or basic starting plans     -->
    <!-- Includes: Free, Starter, Hobby, Community, Lite -->
    <!-- ========================================== -->
    <symbol id="tier-free" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="3" fill="var(--icon-stroke, #9baac2)"/>
    </symbol>

    <symbol id="tier-starter" viewBox="0 0 24 24">
        <path d="M5 20L12 4L19 20H5Z" />
        <path d="M12 12V20" />
    </symbol>

    <symbol id="tier-hobby" viewBox="0 0 24 24">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
    </symbol>

    <symbol id="tier-community" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
        <circle cx="19" cy="9" r="3"/>
        <path d="M21 16c1.5 0 2.5 1 2.5 2.5V21"/>
        <circle cx="5" cy="9" r="3"/>
        <path d="M3 16C1.5 16 .5 17 .5 18.5V21"/>
    </symbol>

    <symbol id="tier-lite" viewBox="0 0 24 24">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
        <line x1="16" y1="8" x2="2" y2="22"/>
    </symbol>

    <!-- ========================================== -->
    <!-- 2. GROWTH                                  -->
    <!-- Icons for scaling and standard plans       -->
    <!-- Includes: Basic, Standard, Plus, Growth    -->
    <!-- ========================================== -->
    <symbol id="tier-basic" viewBox="0 0 24 24">
        <rect x="5" y="5" width="14" height="14" rx="3" />
    </symbol>

    <symbol id="tier-standard" viewBox="0 0 24 24">
        <rect x="3" y="3" width="12" height="12" rx="2" />
        <rect x="9" y="9" width="12" height="12" rx="2" />
    </symbol>

    <symbol id="tier-plus" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="4" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <line x1="8" y1="12" x2="16" y2="12" />
    </symbol>

    <symbol id="tier-growth" viewBox="0 0 24 24">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
        <polyline points="16 7 22 7 22 13" />
    </symbol>

    <!-- ========================================== -->
    <!-- 3. ADVANCED                                -->
    <!-- Icons for professional and premium features-->
    <!-- Includes: Pro, Professional, Business, Premium -->
    <!-- ========================================== -->
    <symbol id="tier-pro" viewBox="0 0 24 24">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
    </symbol>

    <symbol id="tier-professional" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
        <path d="M16 7V5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2" />
        <line x1="2" y1="12" x2="22" y2="12" />
    </symbol>

    <symbol id="tier-business" viewBox="0 0 24 24">
        <rect x="4" y="14" width="4" height="6" rx="1" />
        <rect x="10" y="8" width="4" height="12" rx="1" />
        <rect x="16" y="4" width="4" height="16" rx="1" />
    </symbol>

    <symbol id="tier-premium" viewBox="0 0 24 24">
        <path d="M3 8l9 13L21 8l-4-5H7L3 8z" />
        <path d="M3 8h18" />
        <path d="M12 21L7 3" />
        <path d="M12 21l5-18" />
    </symbol>

    <!-- ========================================== -->
    <!-- 4. TOP LEVEL                               -->
    <!-- Icons for the highest tier plans           -->
    <!-- Includes: Enterprise, Ultimate, Elite, Corporate -->
    <!-- ========================================== -->
    <symbol id="tier-enterprise" viewBox="0 0 24 24">
        <rect x="4" y="10" width="6" height="12" />
        <rect x="14" y="4" width="6" height="18" />
        <path d="M10 22h4" />
        <line x1="6" y1="14" x2="8" y2="14" />
        <line x1="6" y1="18" x2="8" y2="18" />
        <line x1="16" y1="8" x2="18" y2="8" />
        <line x1="16" y1="12" x2="18" y2="12" />
        <line x1="16" y1="16" x2="18" y2="16" />
    </symbol>

    <symbol id="tier-ultimate" viewBox="0 0 24 24">
        <path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 1 0 0-8c-2 0-4 1.33-6 4Z" />
    </symbol>

    <symbol id="tier-elite" viewBox="0 0 24 24">
        <line x1="4" y1="20" x2="20" y2="20" />
        <path d="M4 16L4 6L9 11L12 4L15 11L20 6L20 16Z" />
    </symbol>

    <symbol id="tier-corporate" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M2 12h20" />
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
    </symbol>

    <!-- ========================================== -->
    <!-- 5. SPECIALS                                -->
    <!-- Icons for unique or non-standard user groups -->
    <!-- Includes: Founder, Early Adopter, Legacy, Non-Profit -->
    <!-- ========================================== -->
    <symbol id="tier-founder" viewBox="0 0 24 24">
        <circle cx="12" cy="10" r="6" />
        <path d="M9 15.3V22l3-2 3 2v-6.7" />
        <path d="M12 7v4" />
        <path d="M10 9h4" />
    </symbol>

    <symbol id="tier-early-adopter" viewBox="0 0 24 24">
        <path d="M12 4a10 10 0 0 0-10 10" />
        <path d="M22 14a10 10 0 0 0-10-10" />
        <circle cx="12" cy="14" r="4" />
        <path d="M2 20h20" />
    </symbol>

    <symbol id="tier-legacy" viewBox="0 0 24 24">
        <path d="M6 2h12v4L13 12l5 6v4H6v-4l5-6-5-6V2z" />
    </symbol>

    <symbol id="tier-non-profit" viewBox="0 0 24 24">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
    </symbol>

    <!-- ========================================== -->
    <!-- 6. TECHNICAL / STAFF                       -->
    <!-- Icons for internal roles and environments  -->
    <!-- Includes: Internal, Test, Beta, Alpha, Staging, Admin -->
    <!-- ========================================== -->
    <symbol id="tier-internal" viewBox="0 0 24 24">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
    </symbol>

    <symbol id="tier-test" viewBox="0 0 24 24">
        <path d="M9 3h6" />
        <path d="M10 3v5c0 1.5-.5 3-1.5 4.5l-4 6C3.5 20.5 4 22 6 22h12c2 0 2.5-1.5 1.5-3.5l-4-6c-1-1.5-1.5-3-1.5-4.5V3" />
        <path d="M6 14h12" />
    </symbol>

    <symbol id="tier-beta" viewBox="0 0 24 24">
        <rect x="8" y="6" width="8" height="14" rx="4" />
        <path d="M12 2v4" />
        <path d="M19 10h-3" />
        <path d="M8 10H5" />
        <path d="M19 14h-3" />
        <path d="M8 14H5" />
        <path d="M18 18h-2" />
        <path d="M8 18H6" />
    </symbol>

    <symbol id="tier-alpha" viewBox="0 0 24 24">
        <path d="M12 2l3 7h7l-6 5 2 7-6-5-6 5 2-7-6-5h7z" />
        <circle cx="12" cy="13" r="2" fill="var(--icon-stroke, #9baac2)" />
    </symbol>

    <symbol id="tier-staging" viewBox="0 0 24 24">
        <polygon points="12 2 2 7 12 12 22 7 12 2" />
        <polyline points="2 12 12 17 22 12" />
        <polyline points="2 17 12 22 22 17" />
    </symbol>

    <symbol id="tier-admin" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <circle cx="12" cy="11" r="3" />
    </symbol>

</svg>